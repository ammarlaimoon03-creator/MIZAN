<!DOCTYPE html>
<html dir="rtl" data-theme="auto">
<head>
    <meta charset="UTF-8">
    <style>
        /* ─── Theme tokens ────────────────────────────────────────────── */
        /* Dark is the default; `prefers-color-scheme: light` overrides     */
        /* every variable. Users can also force a theme by setting          */
        /* document.documentElement.dataset.theme = "light" | "dark".       */
        :root {
            --bg-grad-1: #060b12;
            --bg-grad-2: #0d1829;
            --fg:        #e2eaf6;
            --fg-soft:   #8fa4c0;
            --fg-muted:  #5c7090;
            --panel:     #132135;
            --panel-bd:  #1d2e45;
            --accent:    #00f2ff;
            --accent-2:  #00d2ff;
            --good:      #00ffb2;
            --warn:      #ffb700;
            --bad:       #ff3c5f;
            --pill-bg:   rgba(0,210,255,0.10);
            --pill-bd:   rgba(0,210,255,0.30);
            --bar-track: rgba(255,255,255,0.07);
            --code-bg:   rgba(255,255,255,0.06);
            --code-fg:   #fff;
            --shadow:    0 5px 15px rgba(0, 242, 255, 0.3);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-grad-1: #f3f7ff;
                --bg-grad-2: #e6efff;
                --fg:        #0d1829;
                --fg-soft:   #4b5d75;
                --fg-muted:  #6b7c95;
                --panel:     #ffffff;
                --panel-bd:  #d6dff0;
                --accent:    #0099cc;
                --accent-2:  #0077aa;
                --good:      #00a877;
                --warn:      #c98800;
                --bad:       #d12d4d;
                --pill-bg:   rgba(0,153,204,0.10);
                --pill-bd:   rgba(0,153,204,0.35);
                --bar-track: rgba(0,0,0,0.06);
                --code-bg:   rgba(0,0,0,0.05);
                --code-fg:   #0d1829;
                --shadow:    0 5px 15px rgba(0, 153, 204, 0.18);
            }
        }

        /* Hard overrides when JS forces a theme */
        :root[data-theme="dark"] {
            --bg-grad-1: #060b12;  --bg-grad-2: #0d1829;
            --fg: #e2eaf6;         --fg-soft: #8fa4c0;   --fg-muted: #5c7090;
            --panel: #132135;      --panel-bd: #1d2e45;
            --accent: #00f2ff;     --accent-2: #00d2ff;
            --good: #00ffb2;       --warn: #ffb700;      --bad: #ff3c5f;
            --pill-bg: rgba(0,210,255,0.10); --pill-bd: rgba(0,210,255,0.30);
            --bar-track: rgba(255,255,255,0.07);
            --code-bg: rgba(255,255,255,0.06); --code-fg: #fff;
            --shadow: 0 5px 15px rgba(0, 242, 255, 0.3);
        }
        :root[data-theme="light"] {
            --bg-grad-1: #f3f7ff;  --bg-grad-2: #e6efff;
            --fg: #0d1829;         --fg-soft: #4b5d75;   --fg-muted: #6b7c95;
            --panel: #ffffff;      --panel-bd: #d6dff0;
            --accent: #0099cc;     --accent-2: #0077aa;
            --good: #00a877;       --warn: #c98800;      --bad: #d12d4d;
            --pill-bg: rgba(0,153,204,0.10); --pill-bd: rgba(0,153,204,0.35);
            --bar-track: rgba(0,0,0,0.06);
            --code-bg: rgba(0,0,0,0.05); --code-fg: #0d1829;
            --shadow: 0 5px 15px rgba(0, 153, 204, 0.18);
        }

        * { box-sizing: border-box; }
        body {
            width: 360px;
            margin: 0;
            padding: 18px 18px 16px;
            background: linear-gradient(160deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 100%);
            color: var(--fg);
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        .header { text-align: center; margin-bottom: 14px; position: relative; }
        .logo {
            color: var(--accent); font-weight: 900; font-size: 22px;
            letter-spacing: 0.5px;
        }
        .tagline { font-size: 11px; color: var(--fg-soft); margin-top: 2px; }
        .status-dot {
            display: inline-block; width: 8px; height: 8px;
            border-radius: 50%; background: #888; margin-left: 6px;
            vertical-align: middle;
        }
        .status-dot.online  { background: var(--good); box-shadow: 0 0 8px var(--good); }
        .status-dot.offline { background: var(--bad);  box-shadow: 0 0 8px var(--bad); }

        /* Theme toggle (top-left, since dir=rtl) */
        .theme-toggle {
            position: absolute; top: 0; left: 0;
            background: transparent; border: 1px solid var(--panel-bd);
            color: var(--fg-soft); border-radius: 8px;
            font-size: 14px; padding: 2px 8px; cursor: pointer;
            line-height: 1;
        }
        .theme-toggle:hover { color: var(--accent); border-color: var(--accent); }

        textarea {
            width: 100%; height: 90px;
            background: var(--panel); border: 1px solid var(--panel-bd);
            color: var(--fg); border-radius: 12px;
            padding: 10px; resize: none;
            outline: none; font-size: 13px;
            font-family: inherit;
        }
        textarea:focus { border-color: var(--accent); }
        .btn-row { display: flex; gap: 8px; margin-top: 12px; }
        button {
            flex: 1; padding: 11px;
            border: none; border-radius: 12px;
            font-weight: bold; cursor: pointer;
            font-family: inherit; transition: 0.25s;
        }
        button#go {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: var(--bg-grad-1);
        }
        button#go:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        button#go:disabled { opacity: 0.6; cursor: not-allowed; }
        button#openWeb {
            flex: 0 0 44%;
            background: rgba(168, 85, 247, 0.15);
            color: #c69dff;
            border: 1px solid rgba(168, 85, 247, 0.4);
        }
        button#openWeb:hover { background: rgba(168, 85, 247, 0.28); }

        /* ─── Loading panel + progress bar ────────────────────────────── */
        #loading {
            margin-top: 14px;
            padding: 14px;
            border: 1px solid var(--panel-bd);
            background: var(--panel);
            border-radius: 12px;
            display: none;
        }
        #loading .spinner-row {
            display: flex; align-items: center; gap: 8px;
            font-size: 12px; color: var(--fg-soft); margin-bottom: 10px;
        }
        #loading .spinner {
            width: 14px; height: 14px;
            border: 2px solid var(--panel-bd);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: MIZAN-spin 0.9s linear infinite;
        }
        @keyframes MIZAN-spin { to { transform: rotate(360deg); } }
        .progress {
            height: 8px; background: var(--bar-track);
            border-radius: 99px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            transition: width 0.3s ease;
        }
        .progress-pct {
            margin-top: 6px;
            font-size: 11px; color: var(--fg-soft);
            display: flex; justify-content: space-between;
        }

        #res {
            margin-top: 14px; padding: 0;
            border-radius: 12px;
            display: none;
            overflow: hidden;
        }
        .verdict-card {
            padding: 14px;
            border: 1px solid;
            border-radius: 12px;
            text-align: center;
        }
        .verdict-card.real      { border-color: var(--good); background: rgba(0,255,178,0.08); }
        .verdict-card.suspicious{ border-color: var(--warn); background: rgba(255,183,0,0.08); }
        .verdict-card.fake      { border-color: var(--bad);  background: rgba(255,60,95,0.08); }
        .verdict-label { font-size: 16px; font-weight: 800; margin-bottom: 8px; }
        .verdict-card.real      .verdict-label { color: var(--good); }
        .verdict-card.suspicious .verdict-label { color: var(--warn); }
        .verdict-card.fake      .verdict-label { color: var(--bad); }

        .score-row {
            display: flex; justify-content: space-between;
            font-size: 11px; color: var(--fg-soft); margin: 6px 0 4px;
        }
        .bar {
            height: 8px; background: var(--bar-track);
            border-radius: 99px; overflow: hidden;
        }
        .bar-fill { height: 100%; border-radius: 99px; transition: width 0.5s; }
        .verdict-card.real      .bar-fill { background: linear-gradient(90deg, var(--good), #00d2a0); }
        .verdict-card.suspicious .bar-fill { background: linear-gradient(90deg, var(--warn), #ff8c00); }
        .verdict-card.fake      .bar-fill { background: linear-gradient(90deg, var(--bad),  #ff5577); }

        .meta {
            margin-top: 10px;
            font-size: 11px;
            color: var(--fg-soft);
            text-align: right;
            line-height: 1.5;
        }
        .meta b { color: var(--fg); }
        .sources {
            margin-top: 8px;
            display: flex; flex-wrap: wrap; gap: 4px;
            justify-content: flex-end;
        }
        .src-pill {
            background: var(--pill-bg);
            color: var(--accent-2);
            border: 1px solid var(--pill-bd);
            padding: 2px 8px; border-radius: 99px;
            font-size: 10px;
            text-decoration: none;
            transition: 0.2s;
        }
        .src-pill:hover {
            background: var(--accent-2); color: var(--panel);
            border-color: var(--accent-2);
        }

        /* Action row inside verdict (Copy / Open match) */
        .verdict-actions {
            margin-top: 12px;
            display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;
        }
        .verdict-actions button,
        .verdict-actions a {
            flex: 1 1 auto;
            padding: 8px 10px;
            border: 1px solid var(--panel-bd);
            background: transparent;
            color: var(--fg);
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: 0.2s;
        }
        .verdict-actions button:hover,
        .verdict-actions a:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .verdict-actions .copied {
            border-color: var(--good); color: var(--good);
        }

        .info-msg {
            padding: 12px;
            background: rgba(255,170,0,0.08);
            border: 1px solid rgba(255,170,0,0.4);
            color: var(--warn);
            border-radius: 12px;
            text-align: center;
            font-size: 12px;
            line-height: 1.5;
        }
        .err-msg {
            padding: 12px;
            background: rgba(255,60,95,0.08);
            border: 1px solid rgba(255,60,95,0.4);
            color: var(--bad);
            border-radius: 12px;
            text-align: center;
            font-size: 12px;
            line-height: 1.5;
        }
        .err-msg code {
            background: var(--code-bg);
            padding: 1px 6px; border-radius: 4px;
            font-family: 'Consolas', monospace;
            font-size: 11px;
            color: var(--code-fg);
        }
        .footer {
            margin-top: 12px;
            text-align: center;
            font-size: 10px;
            color: var(--fg-muted);
        }
        .footer a { color: var(--accent-2); text-decoration: none; cursor: pointer; }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="header">
        <button id="themeToggle" class="theme-toggle" title="تبديل المظهر">🌓</button>
        <div class="logo">⚡ MIZAN AI <span id="serverDot" class="status-dot" title="السيرفر"></span></div>
        <p class="tagline">مساعدك الذكي لكشف التضليل</p>
    </div>
    <textarea id="txt" placeholder="نص التغريدة سيظهر هنا بعد سحبه..."></textarea>
    <div class="btn-row">
        <button id="go">تحليل المصداقية</button>
        <button id="openWeb" title="فتح الموقع الكامل">🌐 افتح في MIZAN</button>
    </div>

    <!-- Live progress while the LLM backend works (it can take up to 20 s) -->
    <div id="loading" role="status" aria-live="polite">
        <div class="spinner-row">
            <div class="spinner"></div>
            <div id="loadingMsg">جاري الإرسال للسيرفر...</div>
        </div>
        <div class="progress"><div id="progressFill" class="progress-fill"></div></div>
        <div class="progress-pct">
            <span id="progressPct">0%</span>
            <span id="progressEta">~20 ثانية</span>
        </div>
    </div>

    <div id="res"></div>
    <div class="footer">
        <a id="reload">↻ إعادة الفحص</a>
    </div>
    <script src="popup.js"></script>
</body>
</html>
